name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up example config (no real personal data needed to run tests)
        run: cp config.example.json config.json

      - name: Run dedup + decisions-log + push-step tests
        run: python -m pytest tests/test_dedup_pipeline.py -v

      - name: Run scraper helper tests
        run: python -m pytest tests/test_scraper_helpers.py -v

      # Note: resume-generation tests (Word COM / docx2pdf) and the dashboard-logic
      # test (job_dashboard.html, which references a private per-user Artifact and
      # isn't part of this public repo) only run locally on Windows — see
      # run_tests.py in the private project. Nothing here needs Word or a browser.
